<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bubbleFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
    <linearGradient id="bubbleBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- macOS style rounded square background -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Back bubble (smaller, offset, more transparent — represents past conversation) -->
  <g opacity="0.35">
    <rect x="420" y="180" width="340" height="260" rx="48" ry="48" fill="url(#bubbleBack)"/>
    <polygon points="468,400 380,490 520,430" fill="#f59e0b"/>
  </g>

  <!-- Front bubble (larger, centered — represents current/active conversation) -->
  <rect x="280" y="280" width="464" height="360" rx="52" ry="52" fill="url(#bubbleFront)"/>
  <polygon points="332,588 232,680 372,620" fill="#f5a623"/>

  <!-- History lines inside front bubble -->
  <rect x="360" y="370" width="280" height="18" rx="9" fill="#1a1a1a" opacity="0.50"/>
  <rect x="360" y="420" width="200" height="18" rx="9" fill="#1a1a1a" opacity="0.35"/>
  <rect x="360" y="470" width="240" height="18" rx="9" fill="#1a1a1a" opacity="0.35"/>
  <rect x="360" y="520" width="160" height="18" rx="9" fill="#1a1a1a" opacity="0.25"/>

  <!-- Clock motif — small circle with hands in top-right of front bubble -->
  <circle cx="620" cy="360" r="36" fill="none" stroke="#1a1a1a" stroke-width="5" opacity="0.45"/>
  <line x1="620" y1="360" x2="620" y2="340" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <line x1="620" y1="360" x2="634" y2="370" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <circle cx="620" cy="360" r="5" fill="#1a1a1a" opacity="0.45"/>
</svg>
